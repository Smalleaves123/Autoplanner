[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.12",
]
build-backend = "scikit_build_core.build"

[project]
name = "robotnav"
version = "0.6.0"
description = "C++17 mobile robot navigation and finite-horizon MPC backends"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "RobotNav contributors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
tools = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pillow>=9",
]
dashboard = [
    "matplotlib>=3.7",
    "plotly>=5.20",
    "pyyaml>=6.0",
    "streamlit>=1.37",
]
simulation = [
    "mujoco>=3.3,<4",
    "pybullet>=3.2.5,<3.3",
    "gymnasium>=0.29",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = [
    "autoplanner/python/autoplanner",
    "autompc/python/autompc",
    "robotnav/python/robotnav",
]
sdist.include = [
    "CMakeLists.txt",
    "README.md",
    "apps/**/*.cpp",
    "autompc/CMakeLists.txt",
    "autompc/apps/**/*.cpp",
    "autompc/examples/**/*.cpp",
    "autompc/include/**/*.h",
    "autompc/python/autompc/*.py",
    "autompc/python/bindings/CMakeLists.txt",
    "autompc/python/bindings/*.cpp",
    "autompc/src/**/*.cpp",
    "autoplanner/CMakeLists.txt",
    "autoplanner/apps/**/*.cpp",
    "autoplanner/benchmark/CMakeLists.txt",
    "autoplanner/benchmark/*.cpp",
    "autoplanner/examples/**/*.cpp",
    "autoplanner/include/**/*.h",
    "autoplanner/python/autoplanner/*.py",
    "autoplanner/python/bindings/CMakeLists.txt",
    "autoplanner/python/bindings/*.cpp",
    "autoplanner/src/**/*.cpp",
    "cmake/**/*.cmake",
    "examples/**/*.cpp",
    "examples/**/*.py",
    "include/**/*.h",
    "robotnav/python/robotnav/*.py",
    "robotnav/python/bindings/CMakeLists.txt",
    "robotnav/python/bindings/*.cpp",
    "src/**/*.cpp",
]
sdist.exclude = [
    "**/.DS_Store",
    "**/__pycache__",
    "**/__pycache__/*",
    "**/*.pyc",
    "autompc/results/**",
]

[tool.scikit-build.cmake]
build-type = "Release"

[tool.scikit-build.cmake.define]
BUILD_TESTS = "OFF"
BUILD_PYTHON_BINDINGS = "ON"

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*"]
skip = ["*-musllinux_*"]
build-verbosity = 1
test-command = "python {project}/.github/scripts/wheel_smoke.py {project}/autoplanner/data/maps/simple_50x50.txt"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
before-all = "dnf install -y eigen3-devel"

[tool.cibuildwheel.macos]
archs = ["x86_64"]
before-all = "brew install eigen"
environment = { MACOSX_DEPLOYMENT_TARGET = "12.0" }
