[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.12",
]
build-backend = "scikit_build_core.build"

[project]
name = "robotnav"
version = "0.6.0"
description = "C++17 mobile robot navigation and finite-horizon MPC backends"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "RobotNav contributors"}]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
tools = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pillow>=9",
]
dashboard = [
    "matplotlib>=3.7",
    "plotly>=5.20",
    "pyyaml>=6.0",
    "streamlit>=1.37",
]
simulation = [
    "mujoco>=3.3,<4",
    "pybullet>=3.2.5,<3.3",
    "gymnasium>=0.29",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = [
    "autoplanner/python/autoplanner",
    "autompc/python/autompc",
    "robotnav/python/robotnav",
]
sdist.include = [
    "autoplanner/python/**",
    "autompc/python/**",
    "robotnav/python/**",
]

[tool.scikit-build.cmake]
build-type = "Release"

[tool.scikit-build.cmake.define]
BUILD_TESTS = "OFF"
BUILD_PYTHON_BINDINGS = "ON"
