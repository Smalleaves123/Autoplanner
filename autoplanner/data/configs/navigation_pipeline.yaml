map:
  path: autoplanner/data/maps/simple_50x50.txt
  resolution: 1.0
start:
  x: 1
  y: 1
goal:
  x: 48
  y: 48
planner:
  name: astar
  allow_diagonal: true
controller:
  name: stanley
robot:
  footprint: point
  inflate: false
pipeline:
  max_steps: 2500
smoothing:
  name: shortcut
  iterations: 100
trajectory:
  sample_spacing: 0.5
  target_velocity: 1.0
  max_velocity: 2.0
  max_acceleration: 1.5
  max_deceleration: 2.0
  max_lateral_acceleration: 1.5
simulation:
  dt: 0.05
  wheelbase: 1.0
  max_velocity: 2.0
  max_acceleration: 1.5
  max_deceleration: 2.0
  max_steering: 0.7
  max_steering_rate: 1.5
safety:
  goal_tolerance: 0.75
  max_cross_track_error: 5.0
  enforce_collision: true
local_planner:
  name: none
  dwa:
    dynamic_obstacle_margin: 0.0
    dynamic_collision_samples: 3
  mppi:
    prediction_time: 1.0
    horizon: 20
    rollouts: 64
    temperature: 0.5
    velocity_noise: 0.35
    steering_noise: 0.12
    trajectory_weight: 1.0
    heading_weight: 0.25
    velocity_weight: 0.15
    control_weight: 0.2
    control_rate_weight: 0.1
    dynamic_obstacle_weight: 1.0
    dynamic_clearance: 0.5
    dynamic_obstacle_margin: 0.0
    dynamic_collision_samples: 3
    random_seed: 42
