name: RobotNav Wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libeigen3-dev
      - name: Build source distribution
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist
      - name: Rebuild wheel from source distribution
        run: >-
          python -m pip wheel dist/*.tar.gz
          --wheel-dir sdist-wheelhouse --no-deps
      - name: Test source distribution wheel
        run: python -m pip install sdist-wheelhouse/*.whl
      - name: Import and API smoke test
        working-directory: ${{ runner.temp }}
        run: >-
          python ${{ github.workspace }}/.github/scripts/wheel_smoke.py
          ${{ github.workspace }}/autoplanner/data/maps/simple_50x50.txt
      - uses: actions/upload-artifact@v4
        with:
          name: robotnav-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    name: Build wheels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.23.3
      - name: Build and test wheels
        run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: robotnav-wheels-${{ runner.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish wheels to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: robotnav-*
          path: wheelhouse
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse/
