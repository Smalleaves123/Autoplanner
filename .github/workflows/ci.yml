name: RobotNav CI

on:
  push:
  pull_request:

jobs:
  cpp:
    name: C++ build and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libeigen3-dev libgtest-dev
      - name: Install C++ dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja eigen googletest
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTS=ON
          -DBUILD_PYTHON_BINDINGS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Diff hygiene
        run: git diff --check

  sanitizers:
    name: Address and UB sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libeigen3-dev libgtest-dev
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTS=ON
          -DROBOTNAV_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  python-package:
    name: Python wheel smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libeigen3-dev
      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake eigen
      - name: Install build dependencies
        run: python -m pip install --upgrade pip build
      - name: Build wheel
        run: python -m build --wheel --outdir wheelhouse
      - name: Install wheel
        run: python -m pip install wheelhouse/*.whl
      - name: Import and API smoke test
        working-directory: ${{ runner.temp }}
        run: >-
          python ${{ github.workspace }}/.github/scripts/wheel_smoke.py
          ${{ github.workspace }}/autoplanner/data/maps/simple_50x50.txt
      - uses: actions/upload-artifact@v4
        with:
          name: robotnav-wheel-smoke-${{ runner.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
