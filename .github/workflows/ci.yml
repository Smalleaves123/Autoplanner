name: RobotNav CI

on:
  push:
  pull_request:

jobs:
  cpp:
    name: C++ build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libeigen3-dev libgtest-dev
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTS=ON
          -DBUILD_PYTHON_BINDINGS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Diff hygiene
        run: git diff --check

  sanitizers:
    name: Address and UB sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libeigen3-dev libgtest-dev
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTS=ON
          -DROBOTNAV_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  python-package:
    name: Python package smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libeigen3-dev
      - name: Install build dependencies
        run: python -m pip install --upgrade pip scikit-build-core pybind11 numpy
      - name: Build and install wheel
        run: python -m pip install .
      - name: Import and API smoke test
        run: |
          python - <<'PY'
          import autoplanner
          import autompc
          import robotnav

          grid = autoplanner.GridMap()
          assert grid.load_from_txt("autoplanner/data/maps/simple_50x50.txt")
          result = autoplanner.plan(
              "astar", grid, autoplanner.Point2i(1, 1),
              autoplanner.Point2i(48, 48))
          assert result.success, result.message
          assert result.path_length > 0.0
          assert hasattr(autompc, "generate_trajectory")
          assert robotnav.__version__ == "0.6.0"

          scenario = robotnav.DynamicScenario(
              "autoplanner/data/maps/simple_50x50.txt",
              (1, 1), (8, 8),
              robotnav.DynamicConfig(
                  frames=1,
                  steps_per_frame=2,
                  auto_insert_obstacles=False,
              ),
          )
          result = robotnav.run_dynamic_scenario(scenario)
          assert result.trace
          with open("/tmp/robotnav-result.json", "w", encoding="utf-8") as stream:
              import json
              json.dump(result.to_dict(), stream)
          restored = robotnav.DynamicResult.load_json("/tmp/robotnav-result.json")
          assert restored.status_code == result.status_code
          print("python package smoke test passed")
          PY
